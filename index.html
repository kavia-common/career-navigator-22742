/* ═══════════════════════════════════════════
   ANIMATED BACKGROUND — Star Constellation
   ═══════════════════════════════════════════ */
const StarField = () => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    const stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.4 + 0.1,
      speed: Math.random() * 0.15 + 0.02,
      phase: Math.random() * Math.PI * 2,
    }));
    let frame;
    const draw = (t) => {
      ctx.clearRect(0, 0, w, h);
      stars.forEach(s => {
        const pulse = Math.sin(t * 0.001 * s.speed * 10 + s.phase) * 0.3 + 0.7;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(58,175,185,${s.a * pulse})`;
        ctx.fill();
      });
      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          const dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 140) {
            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(stars[j].x, stars[j].y);
            ctx.strokeStyle = `rgba(58,175,185,${0.035 * (1 - dist / 140)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      frame = requestAnimationFrame(draw);
    };
    frame = requestAnimationFrame(draw);
    const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener("resize", resize);
    return () => { cancelAnimationFrame(frame); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, zIndex: 0, pointerEvents: "none" }} />;
};

/* ═══════ SHARED COMPONENTS ═══════ */

const Glass = ({ children, style, hover, glow, onClick, pad = 24 }) => {
  const [h, setH] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        background: h && hover ? C.bgGlassHover : C.bgGlass,
        backdropFilter: "blur(24px) saturate(1.4)",
        WebkitBackdropFilter: "blur(24px) saturate(1.4)",
        border: `1px solid ${h && hover ? C.borderHover : C.border}`,
        borderRadius: 16, padding: pad,
        boxShadow: h && glow ? `0 0 40px ${glow}` : "0 4px 24px rgba(0,0,0,0.2)",
        transition: "all 0.35s cubic-bezier(0.16, 1, 0.3, 1)",
        cursor: onClick ? "pointer" : "default",
        transform: h && hover ? "translateY(-2px)" : "translateY(0)",
        ...style,
      }}>{children}</div>
  );
};

const GlowIcon = ({ emoji, color, size = 44 }) => (
  <div style={{
    width: size, height: size, borderRadius: size * 0.3,
    background: `${color}15`, border: `1px solid ${color}30`,
    display: "flex", alignItems: "center", justifyContent: "center",
    fontSize: size * 0.5, boxShadow: `0 0 20px ${color}20`, flexShrink: 0,
  }}>{emoji}</div>
);

const Ring = ({ pct, size = 52, stroke = 4, color = C.cyan }) => {
  const r = (size - stroke) / 2, circ = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.borderSubtle} strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={circ} strokeDashoffset={circ - (pct / 100) * circ} strokeLinecap="round"
        style={{ transition: "stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1)" }} />
    </svg>
  );
};

const Tag = ({ children, color = C.cyan }) => (
  <span style={{
    padding: "4px 10px", borderRadius: 20, fontSize: 11, fontWeight: 600, fontFamily: font,
    background: `${color}15`, color, border: `1px solid ${color}25`, letterSpacing: 0.3,
    display: "inline-block",
  }}>{children}</span>
);

const Btn = ({ children, onClick, variant = "primary", style: sx = {}, disabled }) => {
  const [h, setH] = useState(false);
  const base = {
    primary: { background: h ? C.cyan : `linear-gradient(135deg, ${C.cyan}, #2A8F98)`, color: C.bg, fontWeight: 600, boxShadow: h ? `0 0 30px ${C.cyanGlow}` : `0 2px 12px rgba(0,0,0,0.3)` },
    ghost: { background: h ? C.cyanSoft : "transparent", color: C.text, border: `1px solid ${h ? C.borderHover : C.border}` },
    coral: { background: h ? C.coral : `linear-gradient(135deg, ${C.coral}, #C85A30)`, color: C.white, fontWeight: 600 },
  };
  return (
    <button onClick={disabled ? undefined : onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        padding: "10px 24px", borderRadius: 10, border: "none", cursor: disabled ? "not-allowed" : "pointer",
        fontSize: 13, fontFamily: font, letterSpacing: 0.2,
        transition: "all 0.3s cubic-bezier(0.16, 1, 0.3, 1)",
        opacity: disabled ? 0.4 : 1, ...base[variant], ...sx,
      }}>{children}</button>
  );
};

const FadeIn = ({ children, delay = 0, style = {} }) => {
  const [show, setShow] = useState(false);
  useEffect(() => { const t = setTimeout(() => setShow(true), delay); return () => clearTimeout(t); }, [delay]);
  return (
    <div style={{
      opacity: show ? 1 : 0, transform: show ? "translateY(0)" : "translateY(18px)",
      transition: `all 0.7s cubic-bezier(0.16, 1, 0.3, 1)`, ...style,
    }}>{children}</div>
  );
};

const Step2 = ({ onNext }) => {
  const [msgs, setMsgs] = useState([
    { from: "ai", text: "I've reviewed your profile. You mentioned leading a cloud migration — tell me about the specific business value delivered, not just the timeline." },
  ]);
  const [input, setInput] = useState("");
  const [phase, setPhase] = useState(0);
  const chatRef = useRef(null);
  const followups = [
    "Reducing latency by 40% is notable. How did you measure that? Walk me through the baseline metrics and who validated the results.",
    "Good depth. You listed 'cloud architecture' — have you designed a multi-region failover from scratch, or worked within existing patterns?",
    "That distinction matters. Your profile shows no P&L ownership yet. Describe a time you managed budget trade-offs above $1M.",
    "I've completed your validation. Strong hands-on technical leadership, with growth gaps in financial management and exec communication. Ready to discover your path.",
  ];
  const send = () => {
    if (!input.trim() || phase >= followups.length) return;
    setMsgs(m => [...m, { from: "user", text: input }]);
    setInput("");
    setTimeout(() => { setMsgs(m => [...m, { from: "ai", text: followups[phase] }]); setPhase(p => p + 1); }, 1000);
  };
  useEffect(() => { if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight; }, [msgs]);

  return (
    <div style={{ padding: "36px 44px", maxWidth: 880, fontFamily: font, display: "flex", flexDirection: "column", height: "calc(100vh - 40px)" }}>
      <FadeIn>
        <Tag color={C.coral}>PHASE 02</Tag>
        <h1 style={{ margin: "10px 0 6px", fontSize: 28, fontWeight: 700, color: C.text }}>The Grill — Deep Competency Validation</h1>
        <p style={{ margin: "0 0 14px", color: C.textMuted, fontSize: 14 }}>Distinguishing "reading the book" from "flying the plane."</p>
      </FadeIn>
      <FadeIn delay={80}>
        <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
          {["Contextual Inquiry", "Experience Verification", "Static Assessment"].map((m, i) => (
            <Tag key={m} color={i === 0 || (i === 1 && phase >= 2) ? C.cyan : C.textDim}>
              {(i === 0 || (i === 1 && phase >= 2)) ? "● " : "○ "}{m}
            </Tag>
          ))}
        </div>
      </FadeIn>
      <div ref={chatRef} style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 14, padding: "8px 0" }}>
        {msgs.map((m, i) => (
          <div key={i} style={{ display: "flex", justifyContent: m.from === "user" ? "flex-end" : "flex-start", gap: 10, alignItems: "flex-end" }}>
            {m.from === "ai" && (
              <div style={{ width: 32, height: 32, borderRadius: 10, flexShrink: 0, background: `linear-gradient(135deg, ${C.coral}, #C85A30)`,
                display: "flex", alignItems: "center", justifyContent: "center", boxShadow: `0 0 16px ${C.coralGlow}`, fontSize: 14 }}>🔥</div>
            )}
            <Glass pad={14} style={{
              maxWidth: "72%",
              background: m.from === "user" ? `linear-gradient(135deg, ${C.cyan}20, ${C.cyan}10)` : C.bgGlass,
              borderColor: m.from === "user" ? `${C.cyan}30` : C.border,
              borderRadius: m.from === "user" ? "14px 14px 4px 14px" : "14px 14px 14px 4px",
            }}>
              <div style={{ fontSize: 14, lineHeight: 1.6, color: C.text }}>{m.text}</div>
            </Glass>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 10, paddingTop: 14, borderTop: `1px solid ${C.border}` }}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()}
          placeholder={phase >= followups.length ? "Assessment complete" : "Share your experience..."}
          disabled={phase >= followups.length}
          style={{ flex: 1, padding: "12px 16px", borderRadius: 12, border: `1px solid ${C.border}`,
            background: C.bgSurface, color: C.text, fontFamily: font, fontSize: 14, outline: "none" }} />
        <Btn onClick={send} disabled={phase >= followups.length} style={{ padding: "12px 18px" }}>Send</Btn>
      </div>
      {phase >= followups.length && (
        <FadeIn delay={200}><div style={{ textAlign: "right", paddingTop: 14 }}><Btn onClick={onNext}>Discover Your Path →</Btn></div></FadeIn>
      )}
    </div>
  );
};

                      style={{ fontSize: 12, padding: "7px 16px" }}>
                      {cart.includes(p.id) ? "Remove" : "🛒 Add to Cart"}
                    </Btn>
                  </div>
                </div>
              </div>
            </Glass>
          </FadeIn>
        ))}
      </div>

      {cart.length >= 2 && (
        <FadeIn delay={100}>
          <Glass style={{ borderColor: `${C.gold}25` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
              <span style={{ fontSize: 20 }}>🛒</span>
              <h3 style={{ margin: 0, fontSize: 16, fontWeight: 600, color: C.text }}>Shopping Cart — Comparison</h3>
            </div>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${C.border}` }}>
                  <th style={{ textAlign: "left", padding: "10px 14px", color: C.textDim, fontSize: 12, fontFamily: fontMono }}>Metric</th>
                  {cart.map(id => { const p = paths.find(x => x.id === id);
                    return <th key={id} style={{ textAlign: "center", padding: "10px 14px", color: p.color, fontSize: 13, fontWeight: 600 }}>{p.role}</th>;
                  })}
                </tr>
              </thead>
              <tbody>
                {[["Timeline","time"],["Persona Fit","fit"],["Gap Difficulty","gap"],["Mastery","m"],["Challenge","c"]].map(([label, key]) => (
                  <tr key={label} style={{ borderBottom: `1px solid ${C.borderSubtle}` }}>
                    <td style={{ padding: "10px 14px", color: C.textMuted }}>{label}</td>
                    {cart.map(id => { const p = paths.find(x => x.id === id);
                      const v = key === "m" || key === "c" ? `${p[key]}/5` : p[key];
                      return <td key={id} style={{ textAlign: "center", padding: "10px 14px", color: C.text, fontWeight: 500 }}>{v}</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 18 }}><Btn onClick={onNext}>Select & Build Roadmap →</Btn></div>
          </Glass>
        </FadeIn>
      )}
      {cart.length === 1 && <FadeIn><div style={{ textAlign: "center", marginTop: 16 }}><Btn onClick={onNext}>Proceed with Path →</Btn></div></FadeIn>}
    </div>
  );
};

              <div style={{ fontSize: 11, color: C.textMuted }}>Track your progress interactively</div>
            </div>
          </div>
          <Tag color={checkedCount > 0 ? C.green : C.textDim}>
            {checkedCount === 0 ? "Not Started" : checkedCount === totalItems ? "Complete!" : "In Progress"}

        </div>
        <div style={{ height: 4, borderRadius: 2, background: C.bgSurface, overflow: "hidden" }}>
          <div style={{
            height: "100%", borderRadius: 2, width: `${(checkedCount / totalItems) * 100}%`,
            background: `linear-gradient(90deg, ${C.cyan}, ${C.violet}, ${C.coral})`,
            boxShadow: `0 0 12px ${C.cyanGlow}`,
            transition: "width 0.6s cubic-bezier(0.16, 1, 0.3, 1)",
          }} />

      </Glass>

      {/* Horizontal pathway with connecting line */}
      <div style={{ position: "relative" }}>
        {/* The connecting journey line */}
        <div style={{
          position: "absolute", top: 28, left: 40, right: 40, height: 3, zIndex: 0,
          background: `linear-gradient(90deg, ${C.cyan}40, ${C.violet}40, ${C.coral}40)`,
          borderRadius: 2,
        }}>
          <div style={{
            height: "100%", borderRadius: 2,
            width: `${(checkedCount / totalItems) * 100}%`,
            background: `linear-gradient(90deg, ${C.cyan}, ${C.violet}, ${C.coral})`,
            boxShadow: `0 0 10px ${C.cyanGlow}`,
            transition: "width 0.8s cubic-bezier(0.16, 1, 0.3, 1)",
          }} />
        </div>

        {/* Phase columns */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, position: "relative", zIndex: 1 }}>
          {phases.map((p, pi) => {
            const phaseChecked = p.items.filter(item => checkedItems[item.id]).length;
            const phaseComplete = phaseChecked === p.items.length;
            return (
              <div key={p.period}>
                {/* Phase dot on the line */}
                <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
                  <div style={{
                    width: 56, height: 56, borderRadius: 16,
                    background: phaseComplete ? `${p.color}25` : C.bgSurface,
                    border: `2px solid ${phaseComplete ? p.color : `${p.color}40`}`,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 24, position: "relative",

                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {p.items.map(item => {
                    const checked = checkedItems[item.id];
                    return (
                      <Glass key={item.id} pad={12} hover
                        glow={checked ? `${C.green}12` : `${p.color}08`}
                        onClick={() => toggle(item.id)}
                        style={{
                          cursor: "pointer",
                          borderColor: checked ? `${C.green}30` : C.border,
                          background: checked ? `${C.green}06` : C.bgGlass,

                        <div style={{ display: "flex", alignItems: "start", gap: 10 }}>
                          {/* Checkbox */}
                          <div style={{
                            width: 20, height: 20, borderRadius: 6, flexShrink: 0, marginTop: 1,
                            border: `2px solid ${checked ? C.green : `${p.color}50`}`,
                            background: checked ? `${C.green}20` : "transparent",
                            display: "flex", alignItems: "center", justifyContent: "center",
                            transition: "all 0.3s ease",
                          }}>
                            {checked && <span style={{ fontSize: 11, color: C.green }}>✓</span>}
                          </div>
                          <div style={{ flex: 1 }}>
                            <div style={{
                              fontSize: 13, fontWeight: 500, color: checked ? C.green : C.text,
                              textDecoration: checked ? "line-through" : "none",
                              opacity: checked ? 0.7 : 1,
                              transition: "all 0.3s ease",
                            }}>{item.t}</div>
                            <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
                              <span style={{
                                padding: "2px 7px", borderRadius: 4, fontSize: 10, fontWeight: 600,
                                background: `${p.color}12`, color: p.color, border: `1px solid ${p.color}20`,

                        </div>

                    );
                  })}

/* ═══════ ROOT ═══════ */

function App() {
  const [role, setRole] = useState(null);
  const [view, setView] = useState("dashboard");
  const [pathMode, setPathMode] = useState(null);

  const login = (r) => { setRole(r); setView(r === "admin" ? "admin-dash" : "dashboard"); setPathMode(null); };
  const logout = () => { setRole(null); setView("dashboard"); setPathMode(null); };
  const choosePath = (mode) => { setPathMode(mode); setView(mode === "linear" ? "linear" : "multiverse"); };

  if (!role) return <Login onLogin={login} />;

  const views = {
    dashboard: <Dashboard go={setView} />,
    step1: <Step1 onNext={() => setView("step2")} />,
    step2: <Step2 onNext={() => setView("pathfork")} />,
    pathfork: <PathFork onChoose={choosePath} />,
    linear: <LinearPath onNext={() => setView("step4")} />,
    multiverse: <MultiverseExplorer onNext={() => setView("step4")} />,
    step4: <RoadmapView onNext={() => setView("step5")} />,
    step5: <MarketplaceView />,
    "admin-dash": <AdminDash />,
    "admin-users": <AdminUsersView />,
    "admin-mp": <AdminMPView />,
    "admin-config": <AdminConfigView />,
  };

  return (
    <div style={{ display: "flex", minHeight: "100vh", background: C.bg, fontFamily: font }}>
      <StarField />
      <Sidebar role={role} view={view} go={setView} onLogout={logout} pathMode={pathMode} />
      <div style={{ flex: 1, overflowY: "auto", maxHeight: "100vh", position: "relative", zIndex: 1 }}>
        {views[view] || <Dashboard go={setView} />}
      </div>
    </div>
  );
}

// ─── Mount ───
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
